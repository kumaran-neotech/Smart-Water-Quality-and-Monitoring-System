<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Water Monitor - Authentication</title>

 
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
   
    body {
      display: none;
      background: linear-gradient(135deg, #1f4037, #99f2c8);
      min-height: 100vh;
      margin: 0;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      padding: 30px;
      text-align: center;
    }
    
    /* Logo Styling */
    .brand-logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin: 0 auto 12px auto;
      display: block;
    }

    .auth-card h2 {
      margin-top: 0;
      margin-bottom: 8px;
      color: #2c3e50;
      text-align: center;
    }
    .auth-card p.subtitle {
      margin-top: 0;
      margin-bottom: 24px;
      text-align: center;
      color: #7f8c8d;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #34495e;
    }
    .form-group input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ccd1d9;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #27ae60;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background-color: #27ae60;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s ease;
    }
    .btn-submit:hover {
      background-color: #219150;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #95a5a6;
      font-size: 12px;
      text-transform: uppercase;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e0e0e0;
    }
    .divider:not(:empty)::before { margin-right: .75em; }
    .divider:not(:empty)::after { margin-left: .75em; }
    .btn-google {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccd1d9;
      border-radius: 6px;
      background-color: #fff;
      color: #333;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background-color 0.2s ease;
    }
    .btn-google:hover {
      background-color: #f8f9fa;
    }
    .btn-google svg {
      width: 18px;
      height: 18px;
    }
    .toggle-text {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #7f8c8d;
    }
    .toggle-text a {
      color: #2980b9;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .toggle-text a:hover {
      text-decoration: underline;
    }
    .msg-box {
      display: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
    }
    .msg-error {
      background-color: #fdedec;
      color: #c0392b;
      border: 1px solid #fadbd8;
    }
    .msg-success {
      background-color: #e8f8f5;
      color: #27ae60;
      border: 1px solid #d1f2eb;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    
    <img src="logo.png" alt="JALPRAGYA Logo" class="brand-logo" />

    <h2 id="formTitle">Welcome Back</h2>
    <p class="subtitle" id="formSubtitle">Sign in to access your water telemetry</p>

    <div id="msgBox" class="msg-box"></div>

    <form id="authForm">
      <div class="form-group" id="nameGroup" style="display: none;">
        <label for="userName">Full Name</label>
        <input type="text" id="userName" placeholder="e.g. John Doe" />
      </div>

      <div class="form-group" id="deviceGroup" style="display: none;">
        <label for="deviceId">Purifier Device ID</label>
        <input type="text" id="deviceId" placeholder="e.g. ESP8266_PURIFIER_01" />
      </div>

      <div class="form-group">
        <label for="userEmail">Email Address</label>
        <input type="email" id="userEmail" placeholder="name@example.com" required />
      </div>

      <div class="form-group">
        <label for="userPassword">Password</label>
        <input type="password" id="userPassword" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
    </form>

    <div class="divider">or</div>

    <button type="button" class="btn-google" id="googleLoginBtn">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </button>

    <div class="toggle-text">
      <span id="toggleQuestion">Don't have an account?</span>
      <a id="toggleAction">Create Account</a>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBxkpre7B472ji7SezHS125QEfWa_nfEH0",
      authDomain: "smart-water-purification-96dc4.firebaseapp.com",
      databaseURL: "https://smart-water-purification-96dc4-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "smart-water-purification-96dc4",
      storageBucket: "smart-water-purification-96dc4.firebasestorage.app",
      messagingSenderId: "360341777265",
      appId: "1:360341777265:web:c0df4e2aa1e3cf55ebc980"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // Session Check: If already signed in, immediately forward to the dashboard
    auth.onAuthStateChanged((user) => {
      if (user) {
        window.location.replace("index.html");
      } else {
        document.body.style.display = "flex";
      }
    });

    let isSignUpMode = false;

    const formTitle = document.getElementById('formTitle');
    const formSubtitle = document.getElementById('formSubtitle');
    const nameGroup = document.getElementById('nameGroup');
    const deviceGroup = document.getElementById('deviceGroup');
    const submitBtn = document.getElementById('submitBtn');
    const toggleAction = document.getElementById('toggleAction');
    const toggleQuestion = document.getElementById('toggleQuestion');
    const msgBox = document.getElementById('msgBox');
    const googleLoginBtn = document.getElementById('googleLoginBtn');

    toggleAction.addEventListener('click', () => {
      isSignUpMode = !isSignUpMode;
      hideMessage();

      if (isSignUpMode) {
        formTitle.innerText = "Create an Account";
        formSubtitle.innerText = "Register your hardware to receive critical alerts";
        nameGroup.style.display = "block";
        deviceGroup.style.display = "block";
        submitBtn.innerText = "Sign Up & Link Purifier";
        toggleQuestion.innerText = "Already registered?";
        toggleAction.innerText = "Sign In";
        document.getElementById('userName').required = true;
      } else {
        formTitle.innerText = "Welcome Back";
        formSubtitle.innerText = "Sign in to access your water telemetry";
        nameGroup.style.display = "none";
        deviceGroup.style.display = "none";
        submitBtn.innerText = "Sign In";
        toggleQuestion.innerText = "Don't have an account?";
        toggleAction.innerText = "Create Account";
        document.getElementById('userName').required = false;
      }
    });

    function showMessage(msg, isError) {
      msgBox.className = isError ? 'msg-box msg-error' : 'msg-box msg-success';
      msgBox.innerText = msg;
      msgBox.style.display = 'block';
    }

    function hideMessage() {
      msgBox.style.display = 'none';
    }

    document.getElementById('authForm').addEventListener('submit', (e) => {
      e.preventDefault();
      hideMessage();

      const email = document.getElementById('userEmail').value.trim();
      const password = document.getElementById('userPassword').value.trim();

      if (isSignUpMode) {
        const name = document.getElementById('userName').value.trim();
        const deviceId = document.getElementById('deviceId').value.trim() || "ESP8266_PURIFIER_01";

        submitBtn.disabled = true;
        submitBtn.innerText = "Creating account...";

        auth.createUserWithEmailAndPassword(email, password)
          .then((cred) => {
            return db.ref('users/' + cred.user.uid).set({
              name: name,
              email: email,
              deviceId: deviceId,
              createdAt: new Date().toISOString()
            });
          })
          .then(() => {
            showMessage("Account created! Redirecting...", false);
            setTimeout(() => { window.location.replace("index.html"); }, 600);
          })
          .catch((err) => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Sign Up & Link Purifier";
            showMessage(err.message, true);
          });
      } else {
        submitBtn.disabled = true;
        submitBtn.innerText = "Authenticating...";

        auth.signInWithEmailAndPassword(email, password)
          .then(() => {
            showMessage("Login successful! Redirecting...", false);
            setTimeout(() => { window.location.replace("index.html"); }, 600);
          })
          .catch((err) => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Sign In";
            showMessage(err.message, true);
          });
      }
    });

    googleLoginBtn.addEventListener('click', () => {
      hideMessage();
      const provider = new firebase.auth.GoogleAuthProvider();

      auth.signInWithPopup(provider)
        .then((result) => {
          const user = result.user;
          const userRef = db.ref('users/' + user.uid);
          return userRef.once('value').then((snap) => {
            if (!snap.exists()) {
              return userRef.set({
                name: user.displayName || "Google User",
                email: user.email,
                deviceId: "ESP8266_PURIFIER_01",
                createdAt: new Date().toISOString()
              });
            }
          });
        })
        .then(() => {
          showMessage("Google sign-in successful! Redirecting...", false);
          setTimeout(() => { window.location.replace("index.html"); }, 600);
        })
        .catch((err) => {
          showMessage(err.message, true);
        });
    });
  </script>
</body>
</html>
